# Scott's separate sprint playtest. The original 05 service remains on 7777.
services:
  world:
    image: longwalk-shared-village:06
    ports:
      - "7778:7777/udp"
    volumes:
      - world-data:/data
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  world-data:
    external: true
    name: longwalk-sprint06_world-data
