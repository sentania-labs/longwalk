# Optional isolated local test. Scott deploys release images through Helm/Argo.
services:
  world:
    image: ghcr.io/sentania-labs/longwalk-server:latest # Pin an exact release for deployment.
    ports:
      - "127.0.0.1:17787:7777/udp"
      - "127.0.0.1:18887:8888"
    environment:
      LONGWALK_ADMIN_SETUP_TOKEN: ${LONGWALK_ADMIN_SETUP_TOKEN:?Provide a random setup token of at least 32 characters}
    volumes:
      - admin07-local-data:/data
    stop_grace_period: 30s
volumes:
  admin07-local-data: {}
