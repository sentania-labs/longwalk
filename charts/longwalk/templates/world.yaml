apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: world
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: game
              containerPort: 7777
              protocol: UDP
            - name: admin
              containerPort: 8888
          env:
            - name: LONGWALK_ADMIN_SETUP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "admin.setupSecret is required" .Values.admin.setupSecret }}
                  key: {{ .Values.admin.setupSecretKey }}
            - name: LONGWALK_ADMIN_ORIGIN
              value: {{ .Values.admin.origin | quote }}
          volumeMounts:
            - name: world
              mountPath: /data
            - name: temporary
              mountPath: /tmp
          startupProbe:
            tcpSocket:
              port: admin
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [sh, -c, 'test -f /tmp/world-ready && test $(( $(date +%s) - $(stat -c %Y /tmp/world-ready) )) -lt 15']
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [sh, -c, 'test -f /tmp/world-ready && test $(( $(date +%s) - $(stat -c %Y /tmp/world-ready) )) -lt 30']
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: world
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default .Release.Name }}
        - name: temporary
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-game
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: game
      port: {{ .Values.service.gamePort }}
      targetPort: game
      protocol: UDP
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-admin
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: admin
      port: 8888
      targetPort: admin
